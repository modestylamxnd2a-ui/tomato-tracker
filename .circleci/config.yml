version: 2.1

jobs:
  is-dim:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: The model weights get ranked
          command: |
            mkdir -p /tmp/wb
            set +o pipefail 2>/dev/null; for i in $(seq 1 10000); do echo "k-$((i*7))"; done > /tmp/wb/seed9_fee7; true
            echo "wrote-$(wc -c </tmp/wb/seed9_fee7) B"
      - persist_to_workspace:
          root: /tmp/wb
          paths:
            - 'seed9_fee7'
  CHECK_QA:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/wb
      - run:
          name: Deserialize upstream payload
          command: |
            { tail -n 10 /tmp/wb/seed9_fee7 > /dev/null; echo "tail10 ok" ; } || true
      - run:
          name: Load repo
          command: git clone --depth 1 -q https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Restore vendored sources
          command: gunzip -c release-final.tgz | tar xvf -
      - run:
          command: ./tap-cli && true
